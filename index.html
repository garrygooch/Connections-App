<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Connecting Wall">
  <meta name="theme-color" content="#0b132b">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Connecting Wall</title>
  <style>
    :root {
      --bg-color: #0b132b;
      --card-bg: #1c2541;
      --card-hover: #3a506b;
      --card-selected: #5bc0be;
      --text-color: #ffffff;
      --accent-color: #6fffe9;
      --error-color: #e76f51;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 20px;
    }

    header {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: 800px;
      margin-bottom: 24px;
      min-height: 110px;
    }

    .brand { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .brand-mark { display: grid; grid-template-columns: repeat(4, 12px); gap: 4px; transform: rotate(-8deg); }
    .brand-mark span { width: 12px; height: 12px; border-radius: 3px; box-shadow: 0 2px 8px #0004; }
    .brand-mark span:nth-child(4n + 1) { background: #233c88; }
    .brand-mark span:nth-child(4n + 2) { background: #008568; }
    .brand-mark span:nth-child(4n + 3) { background: #61124f; }
    .brand-mark span:nth-child(4n) { background: #107e98; }
    .brand h1 { margin: 0; text-align: center; font-size: clamp(1.6rem, 5vw, 2.6rem); line-height: 1.1; font-weight: 900; letter-spacing: -.04em; }
    .brand h1 span { color: var(--accent-color); }
    .brand-tagline { margin: 0; font-size: .65rem; letter-spacing: .3em; text-transform: uppercase; color: #a9bed1; }
    header .strikes { position: absolute; right: 0; bottom: 0; }
    @media (max-width: 540px) { header { padding-bottom: 38px; } header .strikes { left: 0; justify-content: center; } }

    .timer-display {
      font-size: 2rem;
      font-weight: bold;
      background: #1c2541;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid var(--accent-color);
    }

    .countdown-panel { display: flex; align-items: center; gap: 16px; width: 100%; max-width: 800px; margin-top: 20px; }
    .countdown-panel .timer-display { flex-shrink: 0; font-variant-numeric: tabular-nums; }
    .countdown-track { flex: 1; height: 20px; overflow: hidden; background: var(--card-bg); border: 1px solid #3a506b; border-radius: 10px; }
    .countdown-fill { height: 100%; width: 100%; background: var(--accent-color); transition: width 1s linear, background-color .3s; }
    @media (prefers-reduced-motion: reduce) { .countdown-fill { transition: none; } }

    .strikes {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 36px;
      font-size: 1.5rem;
      letter-spacing: 5px;
      color: var(--error-color);
    }

    .life-icon { width: 36px; height: 36px; object-fit: contain; }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      max-width: 800px;
      width: 100%;
    }

    .card {
      color: var(--text-color);
      overflow-wrap: anywhere;
      background-color: var(--card-bg);
      border: 2px solid #2b3a55;
      border-radius: 8px;
      height: 90px;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
      padding: 8px;
      box-sizing: border-box;
    }

    .card:hover:not(.solved) {
      background-color: var(--card-hover);
    }

    .card.selected {
      background-color: var(--card-selected);
      color: #000;
      border-color: var(--accent-color);
    }

    .card.solved {
      cursor: default;
    }

    .card.solved-0 { background-color: #233c88; color: #fff; }
    .card.solved-1 { background-color: #008568; color: #fff; }
    .card.solved-2 { background-color: #61124f; color: #fff; }
    .card.solved-3 { background-color: #107e98; color: #fff; }

    .status-panel {
      margin-top: 20px;
      font-size: 1.2rem;
      text-align: center;
      min-height: 40px;
    }

    .btn {
      background-color: var(--card-selected);
      border: none;
      padding: 10px 20px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }
    .card.dealing { animation: tile-shuffle 950ms ease-in-out both; animation-delay: var(--deal-delay); }
    .card.dealing span { animation: word-reveal 300ms ease-out both; animation-delay: calc(650ms + var(--deal-delay)); }
    @keyframes tile-shuffle {
      0% { transform: translate(0, 0) rotateY(0); }
      35% { transform: translate(var(--shuffle-x), var(--shuffle-y)) rotate(-8deg) scale(.85); }
      65% { transform: translate(0, 0) rotateY(90deg) scale(.95); }
      100% { transform: translate(0, 0) rotateY(0); }
    }
    @keyframes word-reveal { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .card.dealing { animation: none; } .card.dealing span { animation-delay: 0ms; } }
    .grid.connections { max-width: 1100px; grid-template-columns: 1fr; }
    .connection-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)) minmax(180px, 2fr); gap: 12px; }
    .connection-label { background: var(--bg-color); color: white; border: 3px solid; border-radius: 8px; padding: 12px; font: inherit; font-weight: bold; white-space: pre-line; overflow-wrap: anywhere; cursor: pointer; }
    .connection-label:disabled { opacity: 1; cursor: default; }
    .connection-label { height: 90px; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .connection-detail { width: min(34rem, 85vw); max-height: 75dvh; overflow: auto; padding: 20px; border: 1px solid var(--accent-color); border-radius: 12px; background: var(--bg-color); color: white; white-space: pre-wrap; overflow-wrap: anywhere; }
    @media (max-width: 700px) { .connection-row { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; } .connection-label { grid-column: 1 / -1; min-height: 54px; } }
    @media (max-width: 700px) { .connection-label { height: 54px; } }
    .icon-btn { display: inline-grid; place-items: center; min-width: 44px; min-height: 44px; padding: 8px; color: #0b132b; }
    .icon-btn svg { width: 24px; height: 24px; }
    .icon-btn:disabled { opacity: .5; cursor: default; }
    #audio-btn[aria-pressed="true"] .sound-on,
    #audio-btn[aria-pressed="false"] .sound-off,
    #start-btn[data-icon="play"] .next-icon,
    #start-btn[data-icon="next"] .play-icon { display: none; }
    @media (max-width: 540px) { body { padding: 12px; } h1 { font-size: 1.3rem; } .grid { gap: 6px; } .card { font-size: .8rem; padding: 4px; } .timer-display { font-size: 1.3rem; } }
    @media (orientation: landscape) and (max-height: 540px) {
      body { padding: 6px 12px; }
      header { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; min-height: 55px; margin-bottom: 8px; padding-bottom: 0; }
      header .brand { grid-column: 2; grid-row: 1; }
      header .strikes { grid-column: 1; grid-row: 1; position: static; justify-content: flex-start; }
      header .game-controls { grid-column: 3; grid-row: 1; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
      header .btn { margin-top: 0; }
      header .life-icon { width: 24px; height: 24px; }
      .brand { gap: 5px; }
      .brand-mark { grid-template-columns: repeat(4, 6px); gap: 2px; }
      .brand-mark span { width: 6px; height: 6px; border-radius: 1.5px; }
      .brand h1 { font-size: clamp(.8rem, 2.5vw, 1.3rem); }
      .brand-tagline { font-size: .325rem; }
      .grid { gap: 6px; }
      .card { height: clamp(44px, 16dvh, 82px); padding: 4px; font-size: .85rem; }
      .countdown-panel, .status-panel { margin-top: 8px; }
      .timer-display { font-size: 1.2rem; padding: 4px 10px; }
      .countdown-track { height: 12px; }
      .status-panel { font-size: .9rem; min-height: 0; }
      .status-panel:has(#status:empty):not(:has(.game-controls)) { display: none; }
      .btn { margin-top: 5px; padding: 5px 12px; font-size: .85rem; }
      .connection-row { grid-template-columns: repeat(4, minmax(0, 1fr)) minmax(110px, 1.5fr); gap: 6px; }
      .connection-label { grid-column: auto; min-height: 0; height: clamp(44px, 16dvh, 82px); padding: 4px; font-size: .85rem; }
    }
  </style>
</head>
<body>

  <header id="game-header">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
      <h1>Connecting <span>Wall</span></h1>
      <p class="brand-tagline">Sixteen clues. Four connections.</p>
    </div>
    <div class="strikes" id="strikes" role="status" aria-label="Lives activate after two groups are found"></div>
  </header>

  <div class="grid" id="wall"></div>
  <div class="countdown-panel">
    <div class="timer-display" id="timer">03:00</div>
    <div class="countdown-track" id="countdown" role="progressbar" aria-label="Time remaining" aria-valuemin="0" aria-valuemax="180" aria-valuenow="180">
      <div class="countdown-fill" id="countdown-fill"></div>
    </div>
  </div>

  <div class="status-panel" id="game-status-panel">
    <div id="answers"></div>
    <div id="status" role="status"></div>
    <div class="game-controls" id="game-controls">
      <button class="btn icon-btn" id="audio-btn" onclick="toggleAudio()" aria-label="Mute audio" title="Mute audio" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/>
          <path class="sound-on" d="M15 9a4 4 0 0 1 0 6m3-9a8 8 0 0 1 0 12"/>
          <path class="sound-off" d="m16 9 6 6m0-6-6 6"/>
        </svg>
      </button>
      <button class="btn icon-btn" id="start-btn" onclick="startGame()" aria-label="Start game" title="Start game" data-icon="play">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
          <path class="play-icon" d="M7 4v16l14-8z"/>
          <path class="next-icon" d="M5 4v16l12-8zM18 4h2v16h-2z"/>
        </svg>
      </button>
    </div>
  </div>

  <script>
    const soundFiles = {
      select: 'click_on.mp3', success: 'solved_group.mp3',
      fail: 'incorrect_group.mp3', life: 'lose_life.mp3',
      outro: 'game_outro.mp3'
    };
    const sounds = Object.fromEntries(Object.entries(soundFiles).map(([event, file]) => {
      const audio = new Audio(`sounds/${file}`);
      audio.preload = 'auto';
      audio.volume = 0.7;
      return [event, audio];
    }));
    // Fetch the latest edit of the music on every page load.
    const music = new Audio(`sounds/background_music.m4a?v=${Date.now()}`);
    music.volume = 0.25;
    let audioMuted = false;

    function playAudio(audio) {
      // Playback restrictions or missing audio should never interrupt the game.
      const playback = audio.play();
      if (playback) playback.catch(() => {});
    }

    function playSound(type) {
      const audio = sounds[type];
      audio.currentTime = 0;
      playAudio(audio);
    }

    function stopAudio() {
      for (const audio of [music, ...Object.values(sounds)]) {
        audio.pause();
        audio.currentTime = 0;
      }
    }

    function toggleAudio() {
      audioMuted = !audioMuted;
      for (const audio of [music, ...Object.values(sounds)]) audio.muted = audioMuted;
      const button = document.getElementById('audio-btn');
      const label = audioMuted ? 'Unmute audio' : 'Mute audio';
      button.setAttribute('aria-label', label);
      button.setAttribute('title', label);
      button.setAttribute('aria-pressed', audioMuted);
    }

    // Wall Data
    let solutionGroups = [];
    let puzzles = [];
    let currentPuzzleId = null;
    const historyKey = 'connecting-wall-played-v1';
    const playedPuzzleIds = new Set();
    function readPlayedHistory() {
      try {
        const saved = JSON.parse(localStorage.getItem(historyKey) || '[]');
        if (Array.isArray(saved)) saved.forEach(id => playedPuzzleIds.add(String(id)));
      } catch (error) { console.warn('Puzzle history could not be loaded.', error); }
    }
    readPlayedHistory();

    function rememberPuzzle() {
      readPlayedHistory();
      playedPuzzleIds.add(currentPuzzleId);
      try {
        localStorage.setItem(historyKey, JSON.stringify([...playedPuzzleIds]));
      } catch (error) { console.warn('Puzzle history is only available for this session.', error); }
    }
    let checkingSelection = false;
    let connectionRound = false;

    async function loadPuzzles() {
      const button = document.getElementById('start-btn');
      button.disabled = true;
      try {
        const response = await fetch('puzzles.json');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        puzzles = await response.json();
        if (!Array.isArray(puzzles) || !puzzles.length) throw new Error('No puzzles available');
        button.disabled = false;
        initGame();
      } catch (error) {
        statusEl.textContent = 'Could not load puzzles. Run the local server and reload the page.';
        console.error(error);
      }
    }

    let items = [];
    let selectedItems = [];
    let solvedGroups = [];
    let strikesLeft = 3;
    let timeLeft = 180;
    let timerInterval = null;
    let gameActive = false;
    let dealing = false;

    const wallGrid = document.getElementById("wall");
    const statusEl = document.getElementById("status");
    const timerEl = document.getElementById("timer");
    const strikesEl = document.getElementById("strikes");

    function setStartControl(icon, label) {
      const button = document.getElementById('start-btn');
      button.setAttribute('data-icon', icon);
      button.setAttribute('aria-label', label);
      button.setAttribute('title', label);
    }

    function initGame() {
      clearInterval(timerInterval);
      gameActive = false;
      dealing = false;
      checkingSelection = false;
      connectionRound = false;
      revealedConnections.clear();
      wallGrid.classList.remove('connections');
      selectedItems = [];
      solvedGroups = [];
      strikesLeft = 3;
      timeLeft = 180;
      readPlayedHistory();
      const choices = puzzles.filter(p => !playedPuzzleIds.has(p.id));
      if (!choices.length) {
        currentPuzzleId = null;
        items = [];
        solutionGroups = [];
        wallGrid.replaceChildren();
        document.getElementById('answers').replaceChildren();
        const button = document.getElementById('start-btn');
        setStartControl('next', 'All puzzles played');
        button.disabled = true;
        button.style.display = '';
        statusEl.textContent = 'You have played every available puzzle. Add more puzzles to keep playing without repeats.';
        return;
      }
      const puzzle = choices[Math.floor(Math.random() * choices.length)];
      currentPuzzleId = puzzle.id;
      solutionGroups = puzzle.groups.map((g, id) => ({...g, id}));
      document.getElementById('answers').replaceChildren();
      setStartControl('play', 'Start game');
      document.getElementById('start-btn').style.display = '';
      statusEl.textContent = '';
      updateTimerDisplay();
      renderStrikes();
      // Flatten items into single array and shuffle
      items = solutionGroups.flatMap(g => g.items.map(item => ({ text: item, groupId: g.id })));
      for (let i = items.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [items[i], items[j]] = [items[j], items[i]];
      }
      renderWall();
    }

    function enterMobileFullscreen() {
      if (!window.matchMedia?.('(pointer: coarse)').matches || document.fullscreenElement) return;
      const page = document.documentElement;
      if (document.fullscreenEnabled && page.requestFullscreen) {
        page.requestFullscreen().catch(() => {});
      }
    }

    function startGame() {
      if (gameActive || dealing || !puzzles.length) return;
      readPlayedHistory();
      if (connectionRound || playedPuzzleIds.has(currentPuzzleId)) initGame();
      if (!currentPuzzleId) return;
      rememberPuzzle();
      stopAudio();
      playAudio(music);
      enterMobileFullscreen();
      dealing = true;
      document.getElementById("start-btn").style.display = "none";
      statusEl.textContent = 'Shuffling the wall…';
      renderWall();
      setTimeout(() => {
        dealing = false;
        gameActive = true;
        statusEl.textContent = '';
        renderWall();
        beginTimer();
      }, 1400);
    }

    function beginTimer() {
      const startedAt = performance.now();
      timerInterval = setInterval(() => {
        const hasMusicClock = Number.isFinite(music.duration) && music.duration > 0 && !music.paused;
        const remaining = hasMusicClock
          ? 180 * (1 - music.currentTime / music.duration)
          : 180 - (performance.now() - startedAt) / 1000;
        // Let the track finish its built-in cue before ending the round.
        timeLeft = music.ended ? 0 : Math.max(hasMusicClock ? 1 : 0, Math.ceil(remaining));
        updateTimerDisplay();
        if (timeLeft <= 0) {
          endGame(false, "Time's up!");
        }
      }, 100);
    }

    function updateTimerDisplay() {
      const mins = Math.floor(timeLeft / 60).toString().padStart(2, '0');
      const secs = (timeLeft % 60).toString().padStart(2, '0');
      timerEl.textContent = `${mins}:${secs}`;
      const fill = document.getElementById('countdown-fill');
      fill.style.width = `${Math.max(0, timeLeft) / 180 * 100}%`;
      fill.style.backgroundColor = timeLeft <= 30 ? 'var(--error-color)' : 'var(--accent-color)';
      const countdown = document.getElementById('countdown');
      countdown.setAttribute('aria-valuenow', timeLeft);
      countdown.setAttribute('aria-valuetext', `${mins} minutes ${secs} seconds remaining`);
    }

    function renderWall() {
      if (connectionRound) { renderConnections(); return; }
      wallGrid.innerHTML = "";
      items.forEach((itemObj, index) => {
        const card = document.createElement("button");
        card.classList.add("card");
        card.setAttribute("aria-pressed", selectedItems.includes(itemObj.text));
        card.disabled = !gameActive;
        if (dealing) {
          card.classList.add('dealing');
          card.style.setProperty('--deal-delay', `${index * 25}ms`);
          card.style.setProperty('--shuffle-x', `${index % 2 ? -35 : 35}px`);
          card.style.setProperty('--shuffle-y', `${index < 8 ? 25 : -25}px`);
          const word = document.createElement('span');
          word.textContent = itemObj.text;
          card.appendChild(word);
        } else {
          card.textContent = gameActive ? itemObj.text : '';
        }
        card.setAttribute('aria-label', gameActive ? itemObj.text : 'Hidden tile');

        const solvedGroupIndex = solvedGroups.findIndex(g => g.items.includes(itemObj.text));
        
        if (solvedGroupIndex !== -1) {
          card.classList.add("solved", `solved-${solvedGroupIndex}`);
        } else if (selectedItems.includes(itemObj.text)) {
          card.classList.add("selected");
        }

        card.addEventListener("click", () => handleSelect(itemObj.text));
        wallGrid.appendChild(card);
      });
    }

    function handleSelect(itemText) {
      if (!gameActive || checkingSelection || solvedGroups.some(g => g.items.includes(itemText))) return;

      playSound('select');

      if (selectedItems.includes(itemText)) {
        selectedItems = selectedItems.filter(i => i !== itemText);
      } else if (selectedItems.length < 4) {
        selectedItems.push(itemText);
      }

      renderWall();

      if (selectedItems.length === 4) {
        checkingSelection = true;
        setTimeout(checkSelection, 200);
      }
    }

    function captureTilePositions(tiles) {
      return Array.from(tiles, tile => ({
        text: tile.textContent, rect: tile.getBoundingClientRect?.()
      })).filter(position => position.rect);
    }

    function animateGroupMove(previousPositions, tiles = wallGrid.children) {
      if (!previousPositions.length || window.matchMedia?.('(prefers-reduced-motion: reduce)').matches) return;
      Array.from(tiles).forEach(card => {
        const previous = previousPositions.find(position => position.text === card.textContent);
        if (!previous || !card.animate) return;
        const next = card.getBoundingClientRect();
        const x = previous.rect.left - next.left;
        const y = previous.rect.top - next.top;
        card.animate([
          { transform: `translate(${x}px, ${y}px) scale(1)`, zIndex: 2 },
          { transform: `translate(${x * .5}px, ${y * .5}px) scale(1.05)`, zIndex: 2, offset: .45 },
          { transform: 'translate(0, 0) scale(1)', zIndex: 2 }
        ], { duration: 650, easing: 'cubic-bezier(.22, 1, .36, 1)' });
      });
    }

    function checkSelection() {
      checkingSelection = false;
      if (!gameActive || selectedItems.length !== 4) return;
      // Check if selected 4 belong to any single group
      const matchedGroup = solutionGroups.find(g => 
        selectedItems.every(item => g.items.includes(item))
      );

      if (matchedGroup && !solvedGroups.includes(matchedGroup)) {
        const previousPositions = captureTilePositions(wallGrid.children);
        playSound('success');
        solvedGroups.push(matchedGroup);
        if (solvedGroups.length === 3) {
          solvedGroups.push(solutionGroups.find(group => !solvedGroups.includes(group)));
          clearInterval(timerInterval);
        }
        renderStrikes();
        statusEl.textContent = 'Group found!';
        if (solvedGroups.length === 2) statusEl.textContent += ' — Three lives now active!';
        
        // Keep each solved group together in discovery order.
        const remaining = items.filter(item => !solvedGroups.some(group => group.id === item.groupId));
        items = [...solvedGroups.flatMap(group => group.items.map(text => ({text, groupId: group.id}))), ...remaining];
        selectedItems = [];
        checkingSelection = true;
        renderWall();
        animateGroupMove(previousPositions);
        setTimeout(() => {
          checkingSelection = false;
          if (gameActive && solvedGroups.length === 4) {
            endGame(true, "Wall Solved! Excellent work!");
          }
        }, 650);
        return;
      } else {
        playSound(solvedGroups.length >= 2 ? 'life' : 'fail');
        statusEl.textContent = "Incorrect Group!";
        
        // Lives activate once two groups have been found.
        if (solvedGroups.length >= 2) {
          strikesLeft--;
          renderStrikes();
          if (strikesLeft === 0) {
            endGame(false, "Out of lives!");
            return;
          }
        }
      }

      selectedItems = [];
      renderWall();
    }

    function renderStrikes() {
      const livesActive = solvedGroups.length >= 2;
      strikesEl.replaceChildren();
      if (livesActive) {
        for (let i = 0; i < strikesLeft; i++) {
          const life = document.createElement('img');
          life.src = 'images/lives.png';
          life.alt = '';
          life.classList.add('life-icon');
          strikesEl.appendChild(life);
        }
      }
      strikesEl.setAttribute('aria-label', livesActive
        ? `${strikesLeft} of 3 lives remaining`
        : 'Lives activate after two groups are found');
    }

    function endGame(success, message) {
      if (!gameActive) return;
      music.pause();
      if (success) playSound('outro');
      gameActive = false;
      clearInterval(timerInterval);
      setStartControl('next', 'Next puzzle');
      document.getElementById('start-btn').style.display = '';
      selectedItems = [];
      checkingSelection = false;
      connectionRound = true;
      statusEl.textContent = `${message} ${!success && foundConnectionsPending()
        ? 'Reveal the connections you found to resolve the rest of the wall.'
        : 'Guess each connection, then click to reveal.'}`;
      const autoResolve = !success && !foundConnectionsPending();
      if (autoResolve) playSound('success');
      const positions = autoResolve
        ? captureTilePositions(wallGrid.children)
        : [];
      renderConnections(positions);
    }

    const revealedConnections = new Set();
    const answerResizeObserver = window.ResizeObserver ? new ResizeObserver(entries => {
      for (const {target} of entries) target.disabled = target.scrollWidth <= target.clientWidth;
    }) : null;
    function foundConnectionsPending() {
      return solvedGroups.some(group => !revealedConnections.has(group.id));
    }

    function remainingConnectionTiles() {
      return Array.from(wallGrid.children).slice(solvedGroups.length)
        .flatMap(row => Array.from(row.children).slice(0, 4));
    }

    function renderConnections(previousPositions = []) {
      answerResizeObserver?.disconnect();
      wallGrid.innerHTML = '';
      wallGrid.classList.add('connections');
      const colors = ['#233c88', '#008568', '#61124f', '#107e98'];
      const pending = foundConnectionsPending();
      const orderedGroups = pending ? solvedGroups : [...solvedGroups, ...solutionGroups.filter(g => !solvedGroups.includes(g))];
      orderedGroups.forEach((group, index) => {
        const row = document.createElement('div');
        row.classList.add('connection-row');
        group.items.forEach(text => {
          const tile = document.createElement('div');
          tile.classList.add('card', 'solved', `solved-${index}`);
          tile.textContent = text;
          row.appendChild(tile);
        });
        const reveal = document.createElement('button');
        reveal.classList.add('connection-label');
        reveal.style.borderColor = colors[index];
        const isRevealed = revealedConnections.has(group.id);
        reveal.textContent = isRevealed ? group.category : 'Click to reveal';
        reveal.disabled = isRevealed;
        reveal.setAttribute('aria-label', isRevealed ? group.category : `Reveal connection for group ${index + 1}`);
        reveal.addEventListener('click', () => {
          if (isRevealed) return;
          revealedConnections.add(group.id);
          let positions = [];
          if (pending && !foundConnectionsPending() && solvedGroups.length < solutionGroups.length) {
            positions = captureTilePositions(remainingConnectionTiles());
            playSound('success');
            statusEl.textContent = 'Guess each remaining connection, then click to reveal.';
          }
          renderConnections(positions);
        });
        row.appendChild(reveal);
        wallGrid.appendChild(row);
        if (isRevealed && answerResizeObserver) {
          const detail = document.createElement('div');
          detail.id = `connection-detail-${index}`;
          detail.classList.add('connection-detail');
          detail.setAttribute('popover', 'auto');
          detail.textContent = group.category;
          reveal.setAttribute('popovertarget', detail.id);
          row.appendChild(detail);
          reveal.disabled = reveal.scrollWidth <= reveal.clientWidth;
          answerResizeObserver.observe(reveal);
        }
      });
      if (pending) {
        const remaining = items.filter(item => !solvedGroups.some(group => group.id === item.groupId));
        for (let offset = 0; offset < remaining.length; offset += 4) {
          const row = document.createElement('div');
          row.classList.add('connection-row');
          for (const item of remaining.slice(offset, offset + 4)) {
            const tile = document.createElement('div');
            tile.classList.add('card', 'solved');
            tile.textContent = item.text;
            row.appendChild(tile);
          }
          wallGrid.appendChild(row);
        }
      }
      animateGroupMove(previousPositions, remainingConnectionTiles());
    }

    const compactLandscape = window.matchMedia?.('(orientation: landscape) and (max-height: 540px)');
    if (compactLandscape) {
      const controls = document.getElementById('game-controls');
      const placeControls = () => document.getElementById(compactLandscape.matches ? 'game-header' : 'game-status-panel').appendChild(controls);
      compactLandscape.addEventListener('change', placeControls);
      placeControls();
    }
    loadPuzzles();
  </script>
</body>
</html>
